<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 68" width="250" height="68" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Lush Palm Emerald Green Gradient -->
    <linearGradient id="palmGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E8B57" />
      <stop offset="45%" stop-color="#16685E" />
      <stop offset="100%" stop-color="#0A3C36" />
    </linearGradient>

    <!-- Warm Luxury Sun Gold Gradient -->
    <linearGradient id="sunGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7CE" />
      <stop offset="35%" stop-color="#E5C178" />
      <stop offset="70%" stop-color="#C9A86A" />
      <stop offset="100%" stop-color="#997A38" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="emblemShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#emblemShadow)">
    <!-- Original Palm Tree & Rising Sun Emblem -->
    <g transform="translate(6, 4)">
      <!-- Golden Sun Arc Ring Behind Palm Tree -->
      <path d="M12,32 A 18,18 0 1,1 42,32" fill="none" stroke="url(#sunGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="27" cy="25" r="13" fill="url(#sunGoldGrad)" opacity="0.22" />

      <!-- Waves & Earth Foundation -->
      <path d="M6,44 C14,38 22,46 30,40 C36,36 42,42 48,44" fill="none" stroke="url(#sunGoldGrad)" stroke-width="2" stroke-linecap="round" />
      <path d="M4,48 C14,42 24,50 34,44 C40,42 44,46 50,48" fill="none" stroke="url(#palmGreenGrad)" stroke-width="2.2" stroke-linecap="round" />

      <!-- Palm Tree Trunk -->
      <path d="M26,44 C26,34 30,26 27,17 C26,17 24,27 22,44 Z" fill="url(#sunGoldGrad)" />

      <!-- Spreading Lush Palm Fronds -->
      <!-- Top Crown -->
      <path d="M27,17 C27,10 26,4 23,1 C24,6 25,12 27,17 Z" fill="url(#palmGreenGrad)" />
      <!-- Top Right Frond -->
      <path d="M27,17 C32,11 40,7 46,8 C41,11 34,14 27,17 Z" fill="url(#palmGreenGrad)" />
      <!-- Middle Right Frond -->
      <path d="M27,17 C35,16 44,19 49,24 C42,23 33,21 27,17 Z" fill="url(#palmGreenGrad)" />
      <!-- Lower Right Frond -->
      <path d="M27,17 C33,22 41,28 44,35 C38,30 31,23 27,17 Z" fill="url(#palmGreenGrad)" />

      <!-- Top Left Frond -->
      <path d="M27,17 C22,11 14,7 8,8 C13,11 20,14 27,17 Z" fill="url(#palmGreenGrad)" />
      <!-- Middle Left Frond -->
      <path d="M27,17 C19,16 10,19 5,24 C12,23 21,21 27,17 Z" fill="url(#palmGreenGrad)" />
      <!-- Lower Left Frond -->
      <path d="M27,17 C21,22 13,28 10,35 C16,30 23,23 27,17 Z" fill="url(#palmGreenGrad)" />
    </g>

    <!-- Brand Typography -->
    <!-- CAP -->
    <text x="68" y="34" font-family="'Playfair Display', Georgia, serif" font-size="25" font-weight="700" letter-spacing="3" fill="#FFFFFF">CAP</text>
    
    <!-- RESORTS -->
    <text x="128" y="34" font-family="'Playfair Display', Georgia, serif" font-size="25" font-weight="400" letter-spacing="3" fill="url(#sunGoldGrad)">RESORTS</text>
    
    <!-- RETIREMENT & HOLIDAY RESORT Tagline -->
    <text x="69" y="50" font-family="'Jost', 'Montserrat', sans-serif" font-size="7.5" font-weight="600" letter-spacing="3.5" fill="#E5C178" opacity="0.95">RETIREMENT &amp; HOLIDAY RESORT</text>
  </g>
</svg>
